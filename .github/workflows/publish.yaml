---
name: Quarto Publish

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-deploy:
    permissions:
      contents: write
    runs-on: ubuntu-slim
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Quarto
        run: pip install -r requirements.txt

      # On PRs, just check that the site renders
      - name: Render
        if: github.event_name == 'pull_request'
        uses: quarto-dev/quarto-actions/render@v2

      # On main, render and push to the gh-pages branch
      - name: Render and publish to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
